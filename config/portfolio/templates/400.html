{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const saved = localStorage.getItem('site_theme');
            document.documentElement.setAttribute('data-theme', saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 | Bad Request</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>

<body>
    <main class="error-page">
        <div class="container">
            <div class="bento-card error-card">
                <div class="error-icon">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <div class="error-code font-monospace">400</div>
                <h1>Bad Request</h1>
                <p>The request could not be understood or processed by the server.</p>
                <div class="error-actions">
                    <a href="/" class="btn-primary-action">
                        <i class="bi bi-house-door-fill me-2"></i>
                        <span>Return Home</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
