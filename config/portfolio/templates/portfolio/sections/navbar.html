<header class="dock-nav-wrapper fixed-top">
    <div class="container">
        <nav id="mainNavbar" class="dock-navbar">
            <a class="dock-brand" href="#home">
                <span class="prompt-symbol">~/</span>
                <span class="brand-text">{% if profile %}{{ profile.full_name|slugify }}{% else %}portfolio{% endif %}</span>
                <span class="cursor-blink">_</span>
            </a>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="dock-nav-links">
                    <li><a class="dock-link" href="#home"><i class="bi bi-house"></i><span>Home</span></a></li>
                    <li><a class="dock-link" href="#about"><i class="bi bi-person"></i><span>About</span></a></li>
                    <li><a class="dock-link" href="#experience"><i class="bi bi-briefcase"></i><span>Exp</span></a></li>
                    <li><a class="dock-link" href="#projects"><i class="bi bi-code-slash"></i><span>Projects</span></a></li>
                    <li><a class="dock-link" href="#skills"><i class="bi bi-cpu"></i><span>Skills</span></a></li>
                    <li><a class="dock-link" href="#education"><i class="bi bi-mortarboard"></i><span>Education</span></a></li>
                    <li><a class="dock-link" href="#contact"><i class="bi bi-envelope"></i><span>Contact</span></a></li>
                </ul>
            </div>

            <div class="dock-actions">
                <button id="themeToggleBtn" class="theme-switch-btn" type="button" aria-label="Toggle visual theme">
                    <span class="switch-icon icon-sun"><i class="bi bi-sun-fill"></i></span>
                    <span class="switch-icon icon-moon"><i class="bi bi-moon-stars-fill"></i></span>
                    <span class="switch-slider"></span>
                </button>

                <button class="navbar-toggler mobile-dock-toggle d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="bi bi-list"></i>
                </button>

                <a href="#contact" class="dock-cta-btn d-none d-md-inline-flex">
                    Hire Me
                </a>
            </div>
        </nav>
    </div>
</header>
